name: PHYS 1301W Section Monitor

on:
  schedule:
    - cron: "22 * * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

# Needed so the job can commit the updated state.json back to the repo
permissions:
  contents: write

# Prevent overlapping runs (e.g. a manual trigger landing close to the
# scheduled one) from both trying to commit state.json at once - queue them
# instead of running in parallel.
concurrency:
  group: monitor-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # No browser needed anymore - raw HTTP requests only, so this whole
      # job should run in well under 10 seconds now instead of 30-60s.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git pull --rebase --autostash
          git push